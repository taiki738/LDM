model:
  base_learning_rate: 2.0e-06
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    image_size: 4  # This is the latent space size 128 / (2^5) = 4
    channels: 3    # This is the latent dim (z_channels)
    monitor: val/loss_simple_ema

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 4 # latent space size
        in_channels: 3  # latent dim
        out_channels: 3 # latent dim
        model_channels: 128
        attention_resolutions:
        # attention on spatial resolution 2, 1
        - 2
        - 1
        num_res_blocks: 1
        channel_mult:
        - 1
        - 2
        num_head_channels: 32

    first_stage_config:
      target: ldm.modules.first_stage_wrapper.VAEWrapper
      params:
        ckpt_path: /home/tm/img-science/github/PyTorch-VAE/logs/VanillaVAE2D/version_6/checkpoints/last.ckpt
        vae_params:
          in_channels: 3
          latent_dim: 3
          hidden_dims: [32, 64, 128, 256, 512]
          img_size: 128

    cond_stage_config: __is_unconditional__

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 4
    wrap: false
    train:
      target: dataset.AFHQDataset
      params:
        root: /home/tm/img-science/github/PyTorch-VAE/Data/afhq/train
    validation:
      target: dataset.AFHQDataset
      params:
        root: /home/tm/img-science/github/PyTorch-VAE/Data/afhq/val


lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False

  trainer:
    benchmark: True
    max_epochs: 100 # For a test run, maybe less
