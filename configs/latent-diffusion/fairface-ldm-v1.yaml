model:
  base_learning_rate: 4.5e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: image
    image_size: 8 # Latent size for 128x128 input with f=16 VAE (128/16 = 8)
    channels: 3 # Embed dim of the VAE
    monitor: val/loss_simple_ema
    scale_by_std: True

    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [10000]
        cycle_lengths: [10000000000000]
        f_start: [1.e-6]
        f_max: [1.]
        f_min: [1.]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 8 # Latent size
        in_channels: 3 # Embed dim of the VAE
        out_channels: 3 # Embed dim of the VAE
        model_channels: 192
        attention_resolutions:
          - 4
          - 2
          - 1
        num_res_blocks: 2
        channel_mult:
          - 1
          - 2
        num_head_channels: 32

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path: logs/2026-01-02T13-31-12_autoencoder_kl_fairface_64x64x3/checkpoints/last.ckpt
        embed_dim: 3
        monitor: "val/rec_loss"
        ddconfig:
          double_z: True
          z_channels: 3
          resolution: 128
          in_channels: 3
          out_ch: 3
          ch: 32
          ch_mult: [ 1, 2, 4, 8, 16 ] # Total downsampling factor is 16 (2^4) for 128x128 input -> 8x8 latent
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config: __is_unconditional__

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 5
    wrap: false
    train:
      target: ldm.data.fairface.FairFaceTrain # Use new FairFace data loader
      params: {} # Params are handled by FairFaceBase defaults
    validation:
      target: ldm.data.fairface.FairFaceValidation # Use new FairFace data loader
      params: {} # Params are handled by FairFaceBase defaults

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False
        log_images_kwargs:
          inpaint: False

  trainer:
    benchmark: True
    max_epochs: 200